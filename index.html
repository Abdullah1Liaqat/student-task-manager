<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Student Task Manager</h1>

    <form id="task-form">
      <label for="task-title">Task title</label>
      <input type="text" id="task-title" placeholder="e.g. Finish PDC lab report" required>

      <label for="task-description">Description</label>
      <textarea id="task-description" rows="3" placeholder="Optional details"></textarea>

      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <input type="search" id="search-input" placeholder="Search tasks...">

    <ul id="task-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
